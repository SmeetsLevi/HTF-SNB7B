# Least-privilege read-only access for the metrics-collector account.
# Only grants nodes/pods/metrics read permissions required by monitoring.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-reader
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.achrona.io/aggregate-to-collector: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-core
  labels:
    rbac.achrona.io/aggregate-to-collector: "true"
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, namespaces, nodes, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-metrics
  labels:
    rbac.achrona.io/aggregate-to-collector: "true"
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-collector-least-privilege
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-collector-reader
subjects:
  - kind: ServiceAccount
    name: metrics-collector
    namespace: {{ .Release.Namespace }}
